<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Lost Knowledge account.">
  <title>Sign In — Lost Knowledge</title>
  <link rel="stylesheet" href="/lost-knowledge/assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-inner">
    <a href="/lost-knowledge/index.html" class="site-logo">
      <span class="logo-mark">Lost Knowledge</span>
      <div class="logo-dot"></div>
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="/lost-knowledge/index.html"    class="nav-link">Archive</a>
      <a href="/lost-knowledge/about.html"    class="nav-link">About</a>
      <a href="/lost-knowledge/register.html" class="nav-link">Register</a>
      <a href="/lost-knowledge/login.html"    class="nav-link active">Sign In</a>
    </nav>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="section-label">Welcome back</div>
    <h1>Sign in to the archive</h1>
    <p>Access your dashboard, submit entries, and vote on preserved knowledge.</p>
  </div>
</div>

<main>
  <div class="form-wrap">
    <div class="form-card">

      <!-- Flash message area — filled by JS if redirected with ?error= -->
      <div id="flashMsg" style="display:none" class="alert alert-error" role="alert"></div>

      <div class="form-card-header">
        <h2>Sign in</h2>
        <p>Don't have an account? <a href="/lost-knowledge/register.html">Create one free</a></p>
      </div>

      <!--
        SEPARATION OF CONCERNS:
        This HTML form submits to login_process.php via POST.
        All authentication logic (session, DB, password_verify) lives in PHP.
        This file contains ONLY the UI — no server code here.
      -->
      <form id="loginForm" method="POST" action="/lost-knowledge/login_process.php" novalidate>

        <div class="form-group">
          <label for="email">Email address <span class="req">*</span></label>
          <input type="email" id="email" name="email"
                 placeholder="you@example.com"
                 autocomplete="email">
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password <span class="req">*</span></label>
          <input type="password" id="password" name="password"
                 placeholder="Your password"
                 autocomplete="current-password">
          <span class="field-error" id="passError"></span>
        </div>

        <label style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--ink-500);cursor:pointer;margin-bottom:1.25rem">
          <input type="checkbox" name="remember_me" value="1" style="accent-color:var(--amber);width:15px;height:15px">
          Remember me for 30 days
        </label>

        <hr class="form-divider">

        <button type="submit" class="btn btn-primary btn-full btn-lg">Sign in →</button>
      </form>

      <p class="form-footer" style="margin-top:1rem">
        <strong>Demo admin:</strong> admin@lostknowledge.local / Admin@1234
      </p>
    </div>
  </div>
</main>

<footer class="site-footer" style="padding:1.5rem 0">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; <span id="yr"></span> Lost Knowledge</span>
      <span><a href="/lost-knowledge/about.html" style="color:var(--ink-300)">About</a></span>
    </div>
  </div>
</footer>

<script src="/lost-knowledge/assets/js/script.js"></script>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  // Show error from URL query string e.g. login.html?error=invalid
  const params = new URLSearchParams(location.search);
  const err    = params.get('error');
  if (err) {
    const messages = {
      'invalid':  'Invalid email or password. Please try again.',
      'required': 'Email and password are required.',
      'csrf':     'Invalid form submission. Please try again.'
    };
    const box = document.getElementById('flashMsg');
    box.textContent = messages[err] || 'An error occurred. Please try again.';
    box.style.display = 'flex';
  }
</script>
</body>
</html>
